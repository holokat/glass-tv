# Inactive reference workflow. Copy deliberately to .github/workflows/ only
# after the repository workflow permission and release-source review are ready.
name: Linux companion preview checks

on:
  workflow_dispatch:
  push:
    paths:
      - 'linux/**'
      - 'shared/backgrounds/**'
      - '.github/workflows/linux-checks.yml'

permissions:
  contents: read

jobs:
  preview-appimage:
    name: Discovery preview AppImage (Ubuntu 24.04 x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Linux packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes patchelf desktop-file-utils imagemagick
      - name: Install preview and build dependencies
        run: python -m pip install -r requirements.txt -r packaging/requirements-build.txt
      - name: Validate the committed package recipe
        run: packaging/check-appimage-layout.sh
      - name: Run portable core and discovery checks
        run: python -m unittest discover -s tests -t . -v
      - name: Render the actual Qt preview without network activity
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m glasstv_linux --smoke-test --smoke-screenshot "$RUNNER_TEMP/glasstv-linux-source.png"
      - name: Build the x86_64 discovery-only AppImage candidate
        env:
          PYTHON_BIN: ${{ env.pythonLocation }}/bin/python
          GLASS_TV_APPIMAGE_WORK_ROOT: ${{ github.workspace }}/work/linux/x86_64/appimage
          GLASS_TV_APPIMAGE_OUTPUT_ROOT: ${{ github.workspace }}/builds/linux
          GLASS_TV_APPIMAGE_TOOL_ROOT: ${{ github.workspace }}/work/linux/tools
        run: packaging/build-appimage.sh
      - name: Exercise the AppImage extraction fallback
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          artifact=$(find ../builds/linux -maxdepth 1 -type f -name 'GlassTV-*-x86_64.AppImage' -print -quit)
          test -n "$artifact"
          "$artifact" --smoke-test --smoke-screenshot "$RUNNER_TEMP/glasstv-linux-appimage.png"
      - name: Check AppImage payload entries
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          artifact=$(find ../builds/linux -maxdepth 1 -type f -name 'GlassTV-*-x86_64.AppImage' -print -quit)
          test -n "$artifact"
          "$artifact" --appimage-list | grep -E '(^|/)AppRun$'
          "$artifact" --appimage-list | grep -E '(^|/)glasstv-linux.desktop$'
          "$artifact" --appimage-list | grep -E '(^|/)usr/lib/glasstv-linux/resources/backgrounds/fluorescent-anemone-reef.jpg$'
      - name: Save preview evidence and candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: glasstv-linux-discovery-preview
          path: |
            ${{ runner.temp }}/glasstv-linux-source.png
            ${{ runner.temp }}/glasstv-linux-appimage.png
            builds/linux/GlassTV-*-x86_64.AppImage
            builds/linux/GlassTV-*-x86_64.AppImage.sha256
          if-no-files-found: error
          retention-days: 7
